# Build Custom Cape from the checked-out source; publish only from version tags.
# No personal access token or locally compiled JAR is required.
name: Build and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify source build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Build and run SharedCapes tests
        run: ./gradlew --no-daemon clean build

  release:
    name: Build and publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out tagged source and branch history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify tag matches version and comes from main
        shell: bash
        run: |
          VERSION="$(sed -nE 's/^plugin_version[[:space:]]*=[[:space:]]*([^[:space:]]+).*$/\1/p' gradle.properties)"
          test -n "$VERSION"
          if [[ "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match plugin_version ${VERSION}"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tag must point to a commit on main"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Build and test the tagged source
        run: ./gradlew --no-daemon clean build

      - name: Verify JAR and create SHA-256 checksum
        shell: bash
        run: |
          test -f "build/libs/custom-capes-${VERSION}.jar"
          (cd build/libs && sha256sum "custom-capes-${VERSION}.jar" > SHA256SUMS.txt)

      - name: Attest JAR build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: build/libs/custom-capes-*.jar

      - name: Publish GitHub Release with JAR and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/libs/custom-capes-${VERSION}.jar" \
            build/libs/SHA256SUMS.txt \
            --verify-tag \
            --title "Custom Cape $GITHUB_REF_NAME" \
            --generate-notes
